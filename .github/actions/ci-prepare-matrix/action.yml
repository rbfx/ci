# Optionally plans an rbfx CI matrix. The action is pure: it does not check out
# repositories, install tools, restore caches, download artifacts, or run builds.
#
# Steps performed:
# 1. Read `platforms`, one selector per line. `all` selects every supported tag, a
#    platform name such as `linux` selects that platform's tags, and a complete tag
#    selects exactly that tag. `@<short-name>` restricts a selector to one configured
#    build type. A leading `-` excludes matches. With no inclusions, selection starts
#    from `all`; unknown selectors and a result emptied by exclusions fail.
# 2. Parse `build_types` rules in
#    `<platform|*>:<short-name>:<configuration>` form. Empty input uses the canonical
#    defaults: Debug and RelWithDebInfo, or assembleDebug and assembleRelease on
#    Android. Rules for a platform replace the `*` rules for that platform.
# 3. Expand the selectors into ordered `(platform tag, short name, configuration)`
#    entries and remove duplicates and exclusions.
# 4. Resolve each target's GitHub runner and native host platform tag. Android and Web
#    use Linux hosts, iOS uses a macOS x64 host, UWP uses a Windows x64 host, and
#    native targets host themselves.
# 5. If `separate_build_types` is false, group all selected configurations for a
#    platform into one `ci_build_types` map. If true, emit one row per configuration,
#    each containing a one-entry map. Generate unique target and host job names for
#    both layouts.
# 6. Write the resulting `{ "include": [...] }` object to the single `matrix` output.
#
# This action is optional. A caller may provide ci_platform_tag directly to
# ci-prepare-platform and let ci-build-project initialize its default build types.
name: CI Prepare Matrix
description: Prepare a grouped or per-build-type rbfx CI matrix.

inputs:
  platforms:
    description: >-
      Platform selectors, one per line. Use `all`, a platform name such as `linux`,
      or an exact platform tag. Append `@<short-name>` to select one configured build
      type. Prefix a selector with `-` to exclude it.
    required: false
    default: all
  build_types:
    description: >-
      Optional build-type rules, one
      `<platform|*>:<short-name>:<configuration>` mapping per line.
      Platform rules replace the `*` defaults for that platform. Empty uses Debug and
      RelWithDebInfo, with assembleDebug and assembleRelease for Android.
    required: false
    default: ''
  separate_build_types:
    description: >-
      When true, emit one job per platform/build type. When false, emit one job per
      platform with all selected build types in matrix.ci_build_types.
    required: false
    default: 'false'

outputs:
  matrix:
    description: >-
      JSON matrix with ci_platform_tag, ci_host_platform_tag, ci_job_name,
      ci_host_job_name, runs_on, ci_build_type, and resolved ci_build_types fields.
    value: ${{ steps.prepare.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: Validate inputs and prepare matrix
      id: prepare
      shell: bash
      env:
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_BUILD_TYPES: ${{ inputs.build_types }}
        INPUT_SEPARATE_BUILD_TYPES: ${{ inputs.separate_build_types }}
      run: python3 "$GITHUB_ACTION_PATH/../../../script/ci_prepare_matrix.py"
