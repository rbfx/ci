# Builds and optionally installs one downstream project. Run ci-prepare-platform
# earlier in the same job: this action consumes the platform, toolchain, cache, and
# CMake prefix environment prepared by that action. ci-prepare-matrix is optional:
# callers may provide ci_platform_tag directly to ci-prepare-platform and select the
# platform-specific configurations built here through build_types.
#
# The caller owns repository checkout, framework acquisition, and artifact upload.
# Framework source trees and SDKs are selected entirely through the prepared CMake
# prefix list; this action has no framework mode or framework-specific path inputs.
# Non-Android builds use `build_dir` (or the prepared platform-specific default) and
# run CMake install for every selected `build_types` mapping when `install_dir` is
# provided. Android builds execute each mapped Gradle task and copy Gradle outputs
# into the `android` subdirectory of `install_dir`.
name: CI Build Project
description: Build and optionally install a downstream project using the environment prepared by ci-prepare-platform.

inputs:
  project_dir:
    description: "Downstream project root, absolute or relative to `github.workspace`."
    required: true
  build_dir:
    description: "Build directory, absolute or relative to `github.workspace`. Defaults to the prepared platform-specific project build directory."
    required: false
    default: ''
  install_dir:
    description: "Optional install directory, absolute or relative to `github.workspace`. Empty disables installation for non-Android builds; Android defaults to the prepared platform-specific project install directory."
    required: false
    default: ''
  build_types:
    description: "Optional build configurations, one `<platform>:<short-name>:<configuration>` mapping per line. `*` supplies defaults; entries for the active platform replace all defaults. Empty uses the mapping prepared by ci-prepare-platform."
    required: false
    default: ''
  cmake_cache_vars:
    description: "CMake cache variables to pass to the configure step, one `NAME=VALUE` or `NAME:TYPE=VALUE` per line."
    required: false
    default: ''
  android_dir:
    description: "Path to the downstream Android Gradle project, relative to `project_dir`."
    required: false
    default: ''
outputs:
  build_dir:
    description: Resolved project build directory.
    value: ${{ steps.paths.outputs.build_dir }}
  install_dir:
    description: Resolved install directory, including collected Android outputs.
    value: ${{ steps.paths.outputs.install_dir }}

runs:
  using: composite
  steps:
    - name: Resolve build paths
      id: paths
      shell: bash
      env:
        INPUT_PROJECT_SOURCE_DIR: ${{ inputs.project_dir }}
        INPUT_BUILD_DIR: ${{ inputs.build_dir }}
        INPUT_INSTALL_DIR: ${{ inputs.install_dir }}
        INPUT_ANDROID_DIR: ${{ inputs.android_dir }}
        INPUT_BUILD_TYPES: ${{ inputs.build_types }}
      run: |
        ci_build_script="$GITHUB_ACTION_PATH/../../../script/ci_build.sh"

        resolve_workspace_path() {
          local path="$1"
          if [[ "$path" = /* || "$path" =~ ^[A-Za-z]:[/\\] ]]; then
            printf '%s\n' "$path"
          else
            printf '%s/%s\n' "$GITHUB_WORKSPACE" "$path"
          fi
        }

        project_source_dir="$(resolve_workspace_path "$INPUT_PROJECT_SOURCE_DIR")"
        if [[ ! -d "$project_source_dir" ]]; then
          echo "Error: project directory does not exist: $project_source_dir"
          exit 1
        fi

        if [[ -n "$INPUT_BUILD_DIR" ]]; then
          active_project_build_dir="$(resolve_workspace_path "$INPUT_BUILD_DIR")"
        else
          active_project_build_dir="${project_build_dir:-${GITHUB_WORKSPACE}/project-build/${ci_platform_tag}}"
        fi

        project_install_dir=''
        if [[ -n "$INPUT_INSTALL_DIR" ]]; then
          project_install_dir="$(resolve_workspace_path "$INPUT_INSTALL_DIR")"
        elif [[ "${ci_platform:-}" == 'android' ]]; then
          project_install_dir="${GITHUB_WORKSPACE}/project-install/${ci_platform_tag}"
        fi

        if [[ -n "$INPUT_BUILD_TYPES" ]]; then
          ci_build_types="$(python3 -c '
        import json
        import sys

        supported_platforms = {
            "windows", "linux", "macos", "uwp", "android", "ios", "web"
        }
        default_mappings = {}
        platform_mappings = {}
        for line_number, raw_line in enumerate(sys.argv[1].splitlines(), start=1):
            line = raw_line.strip()
            if not line:
                continue
            parts = [part.strip() for part in line.split(":", maxsplit=2)]
            if len(parts) != 3 or any(not part for part in parts):
                raise SystemExit(
                    f"Invalid build_types entry on line {line_number}: {raw_line!r}. "
                    "Expected <platform>:<short-name>:<configuration>."
                )
            platform, short_name, configuration = parts
            if platform != "*" and platform not in supported_platforms:
                raise SystemExit(
                    f"Unsupported build_types platform on line {line_number}: "
                    f"{platform}"
                )
            mappings = (
                default_mappings if platform == "*" else
                platform_mappings.setdefault(platform, {})
            )
            if short_name in mappings:
                raise SystemExit(
                    f"Duplicate build_types mapping on line {line_number}: "
                    f"{platform}:{short_name}"
                )
            mappings[short_name] = configuration
        active_platform = sys.argv[2]
        mappings = platform_mappings.get(active_platform, default_mappings)
        if not mappings:
            raise SystemExit(
                f"build_types does not define configurations for platform "
                f"{active_platform!r}; provide `{active_platform}` or `*` entries"
            )
        sys.stdout.write(json.dumps(mappings, separators=(",", ":")))
        ' "$INPUT_BUILD_TYPES" "$ci_platform")"
        fi

        {
          printf 'ci_build_script=%s\n' "$ci_build_script"
          printf 'project_source_dir=%s\n' "$project_source_dir"
          printf 'ci_active_project_build_dir=%s\n' "$active_project_build_dir"
          printf 'ci_project_install_dir=%s\n' "$project_install_dir"
          if [[ -n "$INPUT_BUILD_TYPES" ]]; then
            printf 'ci_build_types=%s\n' "$ci_build_types"
          fi
        } >> "$GITHUB_ENV"
        {
          printf 'build_dir=%s\n' "$active_project_build_dir"
          printf 'install_dir=%s\n' "$project_install_dir"
        } >> "$GITHUB_OUTPUT"

    - name: Build downstream project
      if: env.ci_platform != 'android'
      shell: bash
      env:
        INPUT_CMAKE_CACHE_VARS: ${{ inputs.cmake_cache_vars }}
      run: |
        args=(build-project --build-dir "$ci_active_project_build_dir")
        if [[ -n "$ci_project_install_dir" ]]; then
          args+=(--install-dir "$ci_project_install_dir")
        fi
        cmake_args=()
        while IFS= read -r cmake_cache_var || [[ -n "$cmake_cache_var" ]]; do
          cmake_cache_var="${cmake_cache_var%$'\r'}"
          if [[ -n "$cmake_cache_var" ]]; then
            cmake_args+=("-D$cmake_cache_var")
          fi
        done <<< "$INPUT_CMAKE_CACHE_VARS"
        "$ci_build_script" "${args[@]}" "$project_source_dir" -- "${cmake_args[@]}"

    - name: Build downstream Android project
      if: env.ci_platform == 'android'
      shell: bash
      env:
        INPUT_ANDROID_DIR: ${{ inputs.android_dir }}
      run: |
        args=(build-android-project)
        android_project_dir="$project_source_dir/$INPUT_ANDROID_DIR"
        "$ci_build_script" "${args[@]}" "$android_project_dir"

        gradle_output_dir="$android_project_dir/build/outputs"
        if [[ ! -d "$gradle_output_dir" ]]; then
          echo "Error: Android Gradle output directory does not exist: $gradle_output_dir"
          exit 1
        fi
        mkdir -p "$ci_project_install_dir/android"
        cp -R "$gradle_output_dir"/. "$ci_project_install_dir/android/"

    - name: Save build cache
      if: ${{ !cancelled() && env.ci_build_cache_hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR || format('{0}/.ccache', github.workspace) }}
        key: ${{ env.ci_cache_id }}-${{ github.sha }}
