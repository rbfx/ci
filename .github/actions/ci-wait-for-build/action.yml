# Waits for a named job in the current workflow run. This supports cross-builds
# because GitHub cannot express dependencies between individual rows of one matrix.
#
# Steps performed:
# 1. Validate the job name, repository/run identity, timeout values, and the optional
#    newline or JSON list of artifact names.
# 2. Poll the current workflow run attempt's jobs endpoint until an exact rendered job
#    name appears and completes, or until the overall timeout expires. GitHub API
#    errors fail immediately.
# 3. Fail immediately if the producer job completes with any conclusion other than
#    success. If no artifacts were requested, write its conclusion and completion
#    timestamp and finish.
# 4. Query unexpired, run-level artifacts and match each requested unique name created
#    after the producer job started. Reject duplicate matching names. After the job
#    completes, keep polling missing artifacts only for `artifact_grace_seconds`.
# 5. Write the successful conclusion, completion timestamp, and comma-separated
#    artifact IDs in requested-name order. Artifact download remains caller-owned.
#
# GitHub artifacts are associated with a run rather than a job, so requested artifact
# names must be unique within the workflow run.
name: CI Wait for Build
description: Wait for a named workflow job and, optionally, its artifacts.

inputs:
  job_name:
    description: Exact rendered workflow job name to wait for.
    required: true
  artifact_names:
    description: Optional run-unique artifact names to wait for after the job succeeds, one per line or as a JSON string array.
    required: false
    default: '[]'
  timeout_seconds:
    description: Maximum time to wait for the job.
    required: false
    default: '3600'
  artifact_grace_seconds:
    description: Maximum time after successful job completion to wait for artifacts to become visible.
    required: false
    default: '60'
  token:
    description: GitHub token with Actions read access. Defaults to the current workflow token.
    required: false
    default: ''

outputs:
  conclusion:
    description: Successful producer-job conclusion.
    value: ${{ steps.wait.outputs.conclusion }}
  completed_at:
    description: Producer-job completion timestamp.
    value: ${{ steps.wait.outputs.completed_at }}
  artifact_ids:
    description: Comma-separated artifact IDs in the same order as artifact_names.
    value: ${{ steps.wait.outputs.artifact_ids }}

runs:
  using: composite
  steps:
    - name: Wait for workflow build
      id: wait
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        INPUT_JOB_NAME: ${{ inputs.job_name }}
        INPUT_ARTIFACT_NAMES: ${{ inputs.artifact_names }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        INPUT_ARTIFACT_GRACE_SECONDS: ${{ inputs.artifact_grace_seconds }}
        INPUT_REPOSITORY: ${{ github.repository }}
        INPUT_RUN_ID: ${{ github.run_id }}
        INPUT_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        "$GITHUB_ACTION_PATH/../../../script/ci_wait_for_build.sh"
